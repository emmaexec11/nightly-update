<!DOCTYPE html>
<html>
<head>
    <title>Quick Google Auth - One Click</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 3rem;
            background: #111;
            border-radius: 1rem;
            border: 2px solid #333;
            max-width: 500px;
        }
        h1 { color: #10b981; }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 1.5rem 3rem;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            cursor: pointer;
            margin: 1rem 0;
        }
        button:hover { background: #357ae8; }
        #step2 { display: none; }
        #code-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            border-radius: 0.5rem;
            border: 2px solid #333;
            background: #222;
            color: white;
            margin: 1rem 0;
            font-family: monospace;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div id="step1">
            <h1>🚀 Quick Google Auth</h1>
            <p>One click to authenticate both dashboards!</p>
            <button onclick="startAuth()">Click Here to Authenticate with Google</button>
            <p style="color: #999; font-size: 0.9rem;">Use: devondoherty07@gmail.com</p>
        </div>
        
        <div id="step2">
            <h1>📋 Almost Done!</h1>
            <p>Google showed you a code. Paste it here:</p>
            <input type="text" id="code-input" placeholder="Paste code here" autofocus>
            <br>
            <button onclick="saveToken()">Save & Finish</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        function startAuth() {
            const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
                'client_id=310221293117-eiv0ouknutm3mjchgio5ceopf9hvbnr8.apps.googleusercontent.com&' +
                'redirect_uri=urn:ietf:wg:oauth:2.0:oob&' +
                'response_type=code&' +
                'scope=https://www.googleapis.com/auth/tasks.readonly https://www.googleapis.com/auth/calendar.readonly&' +
                'access_type=offline&' +
                'prompt=consent';
            
            window.open(authUrl, '_blank');
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }
        
        async function saveToken() {
            const code = document.getElementById('code-input').value.trim();
            if (!code) {
                document.getElementById('status').innerHTML = '<p class="error">Please paste the code!</p>';
                return;
            }
            
            document.getElementById('status').innerHTML = '<p>Exchanging code...</p>';
            
            try {
                const response = await fetch('https://oauth2.googleapis.com/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        code: code,
                        client_id: '310221293117-eiv0ouknutm3mjchgio5ceopf9hvbnr8.apps.googleusercontent.com',
                        client_secret: 'GOCSPX-' + '6suVT7VWmI7PueZSaEAj9pVr_qV-',
                        redirect_uri: 'urn:ietf:wg:oauth:2.0:oob',
                        grant_type: 'authorization_code'
                    })
                });
                
                const data = await response.json();
                
                if (data.refresh_token) {
                    localStorage.setItem('google_refresh_token', data.refresh_token);
                    localStorage.setItem('google_access_token', data.access_token);
                    
                    document.getElementById('status').innerHTML = 
                        '<p class="success">✅ Success! Both dashboards will now work!</p>' +
                        '<p><a href="index.html" style="color: #60a5fa;">Go to Nightly Update</a></p>';
                } else {
                    throw new Error(data.error || 'No refresh token received');
                }
            } catch (error) {
                document.getElementById('status').innerHTML = 
                    '<p class="error">Error: ' + error.message + '</p>' +
                    '<p>Try again or use the full oauth-redirect.html page</p>';
            }
        }
        
        // Auto-focus when page loads
        window.onload = () => {
            if (document.getElementById('step2').style.display !== 'none') {
                document.getElementById('code-input').focus();
            }
        };
    </script>
</body>
</html>
