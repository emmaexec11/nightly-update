        function importData() {
            // Get current state
            let state = JSON.parse(localStorage.getItem('questTracker')) || {
                goals: [],
                categories: []
            };
            
            // Clear existing data
            state.goals = [];
            state.categories = [];
            
            // Add each goal
            devonData.goals.forEach(goalData => {
                const goal = {
                    id: Date.now().toString() + Math.random(),
                    name: goalData.name,
                    category: goalData.category,
                    yearlyTarget: goalData.yearlyTarget,
                    habits: [],
                    links: []
                };
                
                // Add habits
                if (goalData.habits) {
                    goalData.habits.forEach((habitData, i) => {
                        const today = new Date().toISOString().split('T')[0];
                        const habit = {
                            id: Date.now().toString() + Math.random() + i,
                            name: habitData.name,
                            frequency: habitData.frequency || 'daily',
                            notes: habitData.notes || '',
                            customDays: habitData.customDays || [],
                            completed: false,
                            history: [{
                                date: today,
                                completed: false
                            }],
                            stepsExpanded: false
                        };
                        goal.habits.push(habit);
                    });
                }
                
                // Add links
                if (goalData.links) {
                    goalData.links.forEach((linkData, i) => {
                        const link = {
                            id: Date.now().toString() + Math.random() + i,
                            name: linkData.name,
                            url: linkData.url
                        };
                        goal.links.push(link);
                    });
                }
                
                state.goals.push(goal);
            });
            
            // Add categories
            state.categories = devonData.categories;
            
            // Save to localStorage
            localStorage.setItem('questTracker', JSON.stringify(state));
            
            // Show success message
            document.getElementById('success').style.display = 'block';
        }
