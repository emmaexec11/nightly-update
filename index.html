<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #0a0a0a;
            --foreground: #fafafa;
            --card: #1a1a1a;
            --card-hover: #262626;
            --border: rgba(255, 255, 255, 0.1);
            --muted: #6b7280;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            line-height: 1.6;
            min-height: 100vh;
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -0.025em;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .button {
            background-color: var(--foreground);
            color: var(--background);
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .button-outline {
            background-color: transparent;
            color: var(--foreground);
            border: 1px solid var(--border);
        }

        .button-outline:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        .card:hover {
            background-color: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .goals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .goal-card {
            position: relative;
            cursor: pointer;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .goal-type-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .goal-name {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            word-wrap: break-word;
        }

        .goal-target {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.75rem;
            color: var(--muted);
            background-color: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
            background-color: var(--card);
            border: 1px dashed var(--border);
            border-radius: 8px;
        }

        .habits-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .habit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .habit-item:hover {
            background-color: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .habit-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
        }

        .habit-name {
            font-weight: 500;
            font-size: 1.125rem;
        }

        .habit-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .habit-check {
            width: 3rem;
            height: 3rem;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .habit-check:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .habit-check.checked {
            background-color: var(--success);
            border-color: var(--success);
        }

        .checkmark {
            display: none;
            color: white;
            font-size: 1.5rem;
        }

        .habit-check.checked .checkmark {
            display: block;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            padding: 2rem;
        }

        .modal.open {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--foreground);
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .modal-footer {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .success-rate {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .success-rate.good { color: var(--success); }
        .success-rate.warning { color: var(--warning); }
        .success-rate.danger { color: var(--danger); }

        /* Color coding for goal types */
        .goal-card[data-type="Yearly"] .goal-type-label { color: #a78bfa; }
        .goal-card[data-type="Quarterly"] .goal-type-label { color: #60a5fa; }
        .goal-card[data-type="Monthly"] .goal-type-label { color: #34d399; }
        .goal-card[data-type="Weekly"] .goal-type-label { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Execution System</h1>

        <section>
            <h2>
                Goals
                <button class="button" onclick="openGoalModal()">New Goal</button>
            </h2>
            <div class="goals-grid" id="goalsContainer">
                <!-- Goals will be rendered here -->
            </div>
        </section>

        <section>
            <h2>
                Habits
                <button class="button" onclick="openHabitModal()">New Habit</button>
            </h2>
            <div id="habitsContainer">
                <!-- Habits will be rendered here -->
            </div>
        </section>
    </div>

    <!-- Goal Modal -->
    <div id="goalModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-header">Create New Goal</h3>
            <form id="goalForm">
                <div class="form-group">
                    <label>Goal Type</label>
                    <select id="goalType" required>
                        <option value="Yearly">Yearly</option>
                        <option value="Quarterly">Quarterly</option>
                        <option value="Monthly">Monthly</option>
                        <option value="Weekly">Weekly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Goal Name</label>
                    <input type="text" id="goalName" placeholder="e.g., Build $1M ARR Business" required>
                </div>
                <div class="form-group">
                    <label>Target Success %</label>
                    <input type="number" id="goalTarget" min="0" max="100" value="80" required>
                </div>
                <div class="form-group">
                    <label>Description (optional)</label>
                    <textarea id="goalDescription" rows="3" placeholder="Details about this goal..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="button button-outline" onclick="closeGoalModal()">Cancel</button>
                    <button type="submit" class="button">Create Goal</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Habit Modal -->
    <div id="habitModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-header">Create New Habit</h3>
            <form id="habitForm">
                <div class="form-group">
                    <label>Habit Name</label>
                    <input type="text" id="habitName" placeholder="e.g., Read 10 pages" required>
                </div>
                <div class="form-group">
                    <label>Frequency</label>
                    <select id="habitFrequency" required>
                        <option value="Daily">Daily</option>
                        <option value="Weekly">Weekly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Notes (optional)</label>
                    <textarea id="habitNotes" rows="3" placeholder="Success criteria or details..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="button button-outline" onclick="closeHabitModal()">Cancel</button>
                    <button type="submit" class="button">Create Habit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Data storage
        let goals = JSON.parse(localStorage.getItem('executionGoals') || '[]');
        let habits = JSON.parse(localStorage.getItem('executionHabits') || '[]');
        let habitChecks = JSON.parse(localStorage.getItem('executionHabitChecks') || '{}');

        // Render functions
        function renderGoals() {
            const container = document.getElementById('goalsContainer');
            
            if (goals.length === 0) {
                container.innerHTML = '<div class="empty-state">No goals yet. Click "New Goal" to create your first goal!</div>';
                return;
            }

            const goalsByType = {
                Yearly: goals.filter(g => g.type === 'Yearly'),
                Quarterly: goals.filter(g => g.type === 'Quarterly'),
                Monthly: goals.filter(g => g.type === 'Monthly'),
                Weekly: goals.filter(g => g.type === 'Weekly')
            };

            let html = '';
            for (const [type, typeGoals] of Object.entries(goalsByType)) {
                if (typeGoals.length > 0) {
                    typeGoals.forEach(goal => {
                        html += `
                            <div class="card goal-card" data-type="${type}">
                                <div class="goal-type-label">${type.toUpperCase()}</div>
                                <div class="goal-name">${goal.name}</div>
                                <div class="goal-target">Target<br>${goal.target}%</div>
                            </div>
                        `;
                    });
                }
            }
            
            container.innerHTML = html;
        }

        function renderHabits() {
            const container = document.getElementById('habitsContainer');
            
            if (habits.length === 0) {
                container.innerHTML = '<div class="empty-state">No habits yet. Create your first habit!</div>';
                return;
            }

            const today = new Date().toDateString();
            let html = '<div class="habits-list">';
            
            habits.forEach(habit => {
                const isCheckedToday = habitChecks[`${habit.id}-${today}`] || false;
                const successRate = calculateSuccessRate(habit.id);
                const streak = calculateStreak(habit.id);
                
                html += `
                    <div class="habit-item">
                        <div class="habit-info">
                            <div class="habit-name">${habit.name}</div>
                            <div class="habit-stats">
                                <span>🔥 ${streak} streak</span>
                                <span class="success-rate ${getSuccessRateClass(successRate)}">${successRate}% rate</span>
                            </div>
                        </div>
                        <div class="habit-check ${isCheckedToday ? 'checked' : ''}" onclick="toggleHabit('${habit.id}')">
                            <span class="checkmark">✓</span>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function calculateSuccessRate(habitId) {
            const dates = Object.keys(habitChecks)
                .filter(key => key.startsWith(habitId + '-'))
                .map(key => key.split('-').slice(1).join('-'));
            
            if (dates.length === 0) return 0;
            
            const checked = dates.filter(date => habitChecks[`${habitId}-${date}`]).length;
            return Math.round((checked / dates.length) * 100);
        }

        function calculateStreak(habitId) {
            let streak = 0;
            const today = new Date();
            
            for (let i = 0; i < 365; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toDateString();
                
                if (habitChecks[`${habitId}-${dateStr}`]) {
                    streak++;
                } else if (i > 0) {
                    break;
                }
            }
            
            return streak;
        }

        function getSuccessRateClass(rate) {
            if (rate >= 80) return 'good';
            if (rate >= 50) return 'warning';
            return 'danger';
        }

        // Modal functions
        function openGoalModal() {
            document.getElementById('goalModal').classList.add('open');
        }

        function closeGoalModal() {
            document.getElementById('goalModal').classList.remove('open');
            document.getElementById('goalForm').reset();
        }

        function openHabitModal() {
            document.getElementById('habitModal').classList.add('open');
        }

        function closeHabitModal() {
            document.getElementById('habitModal').classList.remove('open');
            document.getElementById('habitForm').reset();
        }

        // Toggle habit check
        function toggleHabit(habitId) {
            const today = new Date().toDateString();
            const key = `${habitId}-${today}`;
            habitChecks[key] = !habitChecks[key];
            localStorage.setItem('executionHabitChecks', JSON.stringify(habitChecks));
            renderHabits();
        }

        // Form submissions
        document.getElementById('goalForm').onsubmit = (e) => {
            e.preventDefault();
            const goal = {
                id: Date.now().toString(),
                type: document.getElementById('goalType').value,
                name: document.getElementById('goalName').value,
                target: parseInt(document.getElementById('goalTarget').value),
                description: document.getElementById('goalDescription').value,
                createdAt: new Date().toISOString()
            };
            goals.push(goal);
            localStorage.setItem('executionGoals', JSON.stringify(goals));
            renderGoals();
            closeGoalModal();
        };

        document.getElementById('habitForm').onsubmit = (e) => {
            e.preventDefault();
            const habit = {
                id: Date.now().toString(),
                name: document.getElementById('habitName').value,
                frequency: document.getElementById('habitFrequency').value,
                notes: document.getElementById('habitNotes').value,
                createdAt: new Date().toISOString()
            };
            habits.push(habit);
            localStorage.setItem('executionHabits', JSON.stringify(habits));
            renderHabits();
            closeHabitModal();
        };

        // Close modals on outside click
        window.onclick = (event) => {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('open');
            }
        };

        // Initial render
        renderGoals();
        renderHabits();
    </script>
</body>
</html>
