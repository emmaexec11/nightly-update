<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Goal Tracker - Level Up Your Life (v2.1)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --bg-hover: #242424;
            
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.2);
            
            --text-primary: #ffffff;
            --text-secondary: #b4b4b4;
            --text-muted: #666666;
            
            --hp: #ef4444;
            --mana: #3b82f6;
            --exp: #fbbf24;
            --success: #10b981;
            --purple: #a855f7;
            --orange: #f97316;
            
            --pixel-font: 'Press Start 2P', monospace;
            --modern-font: 'Inter', -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--modern-font);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Character Section */
        .character-section {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
            border: 2px solid var(--border);
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .character-section::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--purple), var(--mana), var(--exp));
            border-radius: 1.5rem;
            opacity: 0.5;
            z-index: -1;
            animation: gradient-border 3s ease infinite;
        }

        @keyframes gradient-border {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .character-wrapper {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 2rem;
            align-items: center;
        }

        .character-display {
            text-align: center;
        }

        .pixel-character {
            width: 100px;
            height: 100px;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .character-name {
            font-family: var(--pixel-font);
            font-size: 0.75rem;
            margin-top: 0.5rem;
            color: var(--exp);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
        }

        .stats-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .level-display {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(to bottom, var(--exp) 0%, var(--orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .stat-bar {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            position: relative;
            overflow: hidden;
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
        }

        .bar-container {
            height: 0.75rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0.375rem;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 0.5rem;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .hp-bar { background: linear-gradient(90deg, var(--hp), #dc2626); }
        .mana-bar { background: linear-gradient(90deg, var(--mana), #2563eb); }
        .exp-bar { background: linear-gradient(90deg, var(--exp), #f59e0b); }

        /* Goals Hierarchy */
        .goals-section {
            margin-bottom: 3rem;
        }

        .goal-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 1rem;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .goal-card.financial {
            border-left: 4px solid var(--orange);
        }

        .goal-card.spiritual {
            border-left: 4px solid var(--purple);
        }

        .goal-card.health {
            border-left: 4px solid var(--hp);
        }

        .goal-card.community {
            border-left: 4px solid var(--mana);
        }

        .goal-card.personal {
            border-left: 4px solid var(--success);
        }

        .goal-hierarchy {
            padding: 1.5rem;
            background: var(--bg-card);
        }

        .hierarchy-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .hierarchy-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem;
            text-align: center;
            transition: all 0.2s ease;
        }

        .hierarchy-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .hierarchy-label {
            font-family: var(--pixel-font);
            font-size: 0.5rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .hierarchy-value {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .goal-header {
            padding: 1.5rem;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .goal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .goal-actions {
            display: flex;
            gap: 0.5rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .title-icon {
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, var(--purple) 0%, var(--mana) 100%);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .add-goal-btn {
            padding: 0.75rem 1.5rem;
            background: var(--purple);
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-goal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }

        /* Goal Timeline */
        .goal-timeline {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .goal-period {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.2s ease;
        }

        .goal-period:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .period-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .period-label {
            font-family: var(--pixel-font);
            font-size: 0.75rem;
            color: var(--exp);
            text-transform: uppercase;
        }

        .period-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 2rem;
            height: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        .goal-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .goal-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        /* Habits Section */
        .habit-container {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .habit-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .habit-item {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .habit-item:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
            transform: translateX(5px);
        }

        .habit-checkbox {
            width: 4rem;
            height: 4rem;
            min-width: 4rem;
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid var(--border);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .habit-checkbox:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--success);
        }

        .habit-checkbox.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .habit-checkbox.checked::after {
            content: '✓';
            font-size: 2rem;
            font-weight: 800;
            color: white;
            animation: check-pop 0.3s ease;
        }

        @keyframes check-pop {
            0% { transform: scale(0) rotate(-180deg); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .habit-content {
            flex: 1;
        }

        .habit-item .edit-actions {
            display: none;
            gap: 0.25rem;
        }

        .habit-item:hover .edit-actions {
            display: flex;
        }

        .habit-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .frequency-badge {
            font-family: var(--pixel-font);
            font-size: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid var(--purple);
            border-radius: 0.5rem;
            color: var(--purple);
        }

        .habit-stats {
            display: flex;
            gap: 2rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-value {
            font-weight: 600;
            color: var(--success);
        }

        .add-habit-btn {
            width: 100%;
            padding: 1.5rem;
            background: rgba(168, 85, 247, 0.1);
            border: 3px dashed var(--purple);
            border-radius: 1rem;
            color: var(--purple);
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .add-habit-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            transform: translateY(-2px);
        }

        /* Edit Actions */
        .edit-actions {
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s ease;
            flex-shrink: 0;
        }

        .habit-item:hover .edit-actions,
        .goal-period:hover .edit-actions {
            opacity: 1;
        }

        .edit-btn {
            padding: 0.5rem 1rem;
            background: var(--mana);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .edit-btn:hover {
            transform: scale(1.05);
        }

        .delete-btn {
            background: var(--hp);
        }

        .edit-icon-btn {
            padding: 0.375rem 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .edit-icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        /* Daily Reflection */
        .reflection-section {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
            border: 2px solid var(--border);
            border-radius: 1.5rem;
            padding: 2.5rem;
            text-align: center;
            margin-top: 3rem;
        }

        .reflection-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(to right, var(--purple) 0%, var(--mana) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .reflection-textarea {
            width: 100%;
            min-height: 150px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            color: var(--text-primary);
            font-size: 1.125rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.2s ease;
        }

        .reflection-textarea:focus {
            outline: none;
            border-color: var(--purple);
        }

        .complete-day-btn {
            margin-top: 2rem;
            padding: 1.5rem 3rem;
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            border: none;
            border-radius: 1rem;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .complete-day-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.4);
        }

        .complete-day-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }

        .complete-day-btn:hover::before {
            animation: shine 0.5s ease;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 1.5rem;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 2px solid var(--border);
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .modal-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 1rem;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--purple);
        }

        .modal-footer {
            padding: 1.5rem 2rem;
            border-top: 2px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .btn-primary {
            background: var(--purple);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Nice modal styling */
        .modal {
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: scale(0.95) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        /* Color picker */
        .color-picker {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .color-option {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.5rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Character Section -->
        <div class="character-section">
            <div class="character-wrapper">
                <div class="character-display">
                    <svg class="pixel-character" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                        <!-- Cool Pixel Wizard/Knight Character -->
                        <rect x="13" y="3" width="6" height="2" fill="#fbbf24"/>
                        <rect x="12" y="5" width="8" height="2" fill="#fbbf24"/>
                        <rect x="11" y="7" width="10" height="6" fill="#f9a8d4"/>
                        <rect x="13" y="8" width="2" height="2" fill="#1e293b"/>
                        <rect x="17" y="8" width="2" height="2" fill="#1e293b"/>
                        <rect x="15" y="10" width="2" height="1" fill="#dc2626"/>
                        <rect x="10" y="13" width="12" height="8" fill="#a855f7"/>
                        <rect x="12" y="14" width="8" height="1" fill="#fbbf24"/>
                        <rect x="9" y="15" width="14" height="6" fill="#a855f7"/>
                        <rect x="11" y="21" width="4" height="4" fill="#475569"/>
                        <rect x="17" y="21" width="4" height="4" fill="#475569"/>
                        <rect x="10" y="25" width="5" height="3" fill="#1e293b"/>
                        <rect x="17" y="25" width="5" height="3" fill="#1e293b"/>
                        <!-- Staff -->
                        <rect x="6" y="12" width="2" height="12" fill="#92400e"/>
                        <rect x="5" y="10" width="4" height="3" fill="#3b82f6"/>
                        <rect x="6" y="11" width="2" height="1" fill="#60a5fa"/>
                        <!-- Magic effects -->
                        <rect x="3" y="9" width="2" height="2" fill="#fbbf24" opacity="0.8"/>
                        <rect x="9" y="8" width="1" height="1" fill="#a855f7" opacity="0.6"/>
                        <rect x="4" y="12" width="1" height="1" fill="#60a5fa" opacity="0.7"/>
                    </svg>
                    <div class="character-name">DEVON THE WISE</div>
                </div>
                <div class="stats-panel">
                    <div>
                        <div class="level-display">LEVEL 18</div>
                        <div class="stat-bar">
                            <div class="stat-label">
                                <span>HP</span>
                                <span>180/200</span>
                            </div>
                            <div class="bar-container">
                                <div class="bar-fill hp-bar" style="width: 90%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-label">
                            <span>MANA</span>
                            <span>145/150</span>
                        </div>
                        <div class="bar-container">
                            <div class="bar-fill mana-bar" style="width: 97%"></div>
                        </div>
                    </div>

    <!-- Goal Settings Modal -->
    <div id="goalSettingsModal" class="modal-overlay">

                <h3 class="modal-title">Goal Settings</h3>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Goal Title</label>
                    <input type="text" class="form-input" id="settingsTitle" placeholder="Goal title...">

                    <label class="form-label">Category</label>
                    <select class="form-select" id="settingsCategory">
                        <option value="spiritual">Spiritual & Mind</option>
                        <option value="financial">Financial & Wealth</option>

                        <option value="community">Community & Relationships</option>

                    <div class="color-picker">
                        <button class="color-option" style="background: #a855f7;" data-color="#a855f7"></button>
                        <button class="color-option" style="background: #f59e0b;" data-color="#f59e0b"></button>
                        <button class="color-option" style="background: #ef4444;" data-color="#ef4444"></button>
                        <button class="color-option" style="background: #3b82f6;" data-color="#3b82f6"></button>
                        <button class="color-option" style="background: #10b981;" data-color="#10b981"></button>
                        <button class="color-option" style="background: #ec4899;" data-color="#ec4899"></button>
                        <button class="color-option" style="background: #8b5cf6;" data-color="#8b5cf6"></button>
                        <button class="color-option" style="background: #14b8a6;" data-color="#14b8a6"></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeGoalSettings()">Cancel</button>
                <button class="btn btn-primary" onclick="saveGoalSettings()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Default goals - always available as fallback
        const DEFAULT_GOALS = [
            {
                id: 1,
                title: 'Spirituality & Nervous System',
                category: 'spiritual',
                yearly: 'Define your yearly spiritual goal',
                leadIndicator: 'Actions I control (e.g., daily meditation)',
                lagIndicator: 'Results I measure (e.g., anxiety levels)',
                quarterly: 'Define quarterly milestone',
                monthly: 'Define monthly target',
                weekly: 'Define weekly practice'
            },
            {
                id: 2,
                title: 'Financial & Wealth Goal',
                category: 'financial',
                yearly: 'Define your yearly financial goal',
                quarterly: 'Define quarterly milestone',
                monthly: 'Define monthly target',
                weekly: 'Define weekly actions'
            },
            {
                id: 3,
                title: 'Health & Fitness',
                category: 'health',
                yearly: 'Define your yearly health goal',
                quarterly: 'Define quarterly milestone',
                monthly: 'Define monthly target',
                weekly: 'Define weekly workouts'
            },
            {
                id: 4,
                title: 'Community & Relationships',
                category: 'community',
                yearly: 'Define your yearly relationship goal',
                quarterly: 'Define quarterly milestone',
                monthly: 'Define monthly target',
                weekly: 'Define weekly connections'
            },
            {
                id: 5,
                title: 'Personal Development',
                category: 'personal',
                yearly: 'Define your yearly growth goal',
                quarterly: 'Define quarterly milestone',
                monthly: 'Define monthly target',
                weekly: 'Define weekly learning'
            }
        ];

        const DEFAULT_HABITS = [
            { id: 1, goalId: 1, name: 'Morning Routine', frequency: 'daily', completed: false, streak: 12, successRate: 85 },
            { id: 2, goalId: 1, name: 'Meditation', frequency: 'daily', completed: true, streak: 8, successRate: 92 },
            { id: 3, goalId: 2, name: 'Review Trading Charts', frequency: 'daily', completed: false, streak: 24, successRate: 96 },
            { id: 4, goalId: 3, name: 'Workout', frequency: 'daily', completed: false, streak: 15, successRate: 88 }
        ];

        // State - starts with defaults, loadState() may override
        let state = {
            goals: [],
            habits: [],
            level: 0,
            hp: { current: 100, max: 100 },
            mana: { current: 50, max: 50 },
            exp: { current: 0, max: 100 },
            totalDaysActive: 0,
            currentStreak: 0
        };

        // Load state from localStorage - only override if valid data exists
        function loadState() {
            try {
                const saved = localStorage.getItem('questTracker');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Only use saved state if it has valid goals array with entries
                    if (parsed && Array.isArray(parsed.goals) && parsed.goals.length > 0) {
                        state = parsed;
                        // Ensure habits array exists
                        if (!Array.isArray(state.habits)) {
                            state.habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));
                        }
                    } else {
                        // Bad data in localStorage - clear it and keep defaults
                        localStorage.removeItem('questTracker');
                    }
                }
            } catch (e) {
                // Corrupted localStorage - clear and use defaults
                console.warn('Failed to load saved state, using defaults:', e);
                localStorage.removeItem('questTracker');
            }
            // Also clean up old storage keys from previous versions
            localStorage.removeItem('executionSystem');
            localStorage.removeItem('modernTracker');
        }

        // Save state
        function saveState() {
            localStorage.setItem('questTracker', JSON.stringify(state));
        }

        // Initialize
        function init() {
            loadState();

            // Final safety net: if goals are somehow empty, restore defaults
            if (!state.goals || state.goals.length === 0) {
                state.goals = JSON.parse(JSON.stringify(DEFAULT_GOALS));
                state.habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));
            }

            renderGoals();
            updateStats();

            // Color picker functionality
            document.querySelectorAll('.color-option').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.color-option').forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });

            // Enter key support for edit modal
            document.getElementById('editModalInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    saveEditModal();
                }
            });

            // FORCE SHOW GOALS FOR DEBUGGING
            if (state.goals.length === 0) {
                alert("ERROR: No goals in state after init!");
            }
            console.log("Init complete, rendering", state.goals.length, "goals");
        }

        // Render goals
        function renderGoals() {
            const container = document.getElementById('goalsContainer');
            console.log("RenderGoals: Rendering", state.goals.length, "goals");

            // Check if we have goals
            if (!state.goals || state.goals.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 3rem; color: #666;">
                        <p style="font-size: 1.25rem; margin-bottom: 1rem;">No goals yet!</p>
                        <p>Click "New Goal" to start your journey.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = state.goals.map(goal => {
                const goalColor = goal.color || getCategoryColor(goal.category);
                return `
                <div class="goal-card ${goal.category}" style="border-left-color: ${goalColor};">
                    <div class="goal-header">
                        <h3 class="goal-title">${goal.title}</h3>
                        <div class="goal-actions">
                            <button class="icon-btn" onclick="editGoal(${goal.id})" title="Edit settings">⚙️</button>
                            <button class="icon-btn" onclick="deleteGoal(${goal.id})" title="Delete goal" style="color: var(--danger);">🗑️</button>
                        </div>
                    </div>
                    <div class="goal-hierarchy">
                        <div style="margin-bottom: 1.5rem;">
                            <div style="margin-bottom: 1rem;">
                                <label style="font-size: 0.875rem; color: #999;">YEARLY GOAL</label>
                                <div style="font-size: 1.125rem; margin-top: 0.25rem;">${goal.yearly}</div>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div>
                                    <label style="font-size: 0.75rem; color: #666;">Lead Indicator (Actions)</label>
                                    <input type="text" 
                                        value="${goal.leadIndicator || ''}" 
                                        onchange="updateGoalField(${goal.id}, 'leadIndicator', this.value)"
                                        placeholder="Actions I control"
                                        style="width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 0.5rem; color: white; margin-top: 0.25rem; font-size: 0.875rem; border-radius: 0.25rem;">
                                </div>
                                <div>
                                    <label style="font-size: 0.75rem; color: #666;">Lag Indicator (Results)</label>
                                    <input type="text" 
                                        value="${goal.lagIndicator || ''}" 
                                        onchange="updateGoalField(${goal.id}, 'lagIndicator', this.value)"
                                        placeholder="Results I measure"
                                        style="width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 0.5rem; color: white; margin-top: 0.25rem; font-size: 0.875rem; border-radius: 0.25rem;">
                                </div>
                            </div>
                        </div>
                        <div class="hierarchy-grid">
                            <div class="hierarchy-item" onclick="editGoalPeriod(${goal.id}, 'yearly')" style="cursor: pointer; border-color: ${goalColor}20;">
                                <div class="hierarchy-label" style="color: ${goalColor};">YEARLY</div>
                                <div class="hierarchy-value">${goal.yearly}</div>
                            </div>
                            <div class="hierarchy-item" onclick="editGoalPeriod(${goal.id}, 'quarterly')" style="cursor: pointer; border-color: ${goalColor}20;">
                                <div class="hierarchy-label" style="color: ${goalColor};">QUARTERLY</div>
                                <div class="hierarchy-value">${goal.quarterly}</div>
                            </div>
                            <div class="hierarchy-item" onclick="editGoalPeriod(${goal.id}, 'monthly')" style="cursor: pointer; border-color: ${goalColor}20;">
                                <div class="hierarchy-label" style="color: ${goalColor};">MONTHLY</div>
                                <div class="hierarchy-value">${goal.monthly}</div>
                            </div>
                            <div class="hierarchy-item" onclick="editGoalPeriod(${goal.id}, 'weekly')" style="cursor: pointer; border-color: ${goalColor}20;">
                                <div class="hierarchy-label" style="color: ${goalColor};">WEEKLY</div>
                                <div class="hierarchy-value">${goal.weekly}</div>
                            </div>
                        </div>
                        <h4 style="font-size: 0.875rem; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 1rem;">Daily Training</h4>
                        <div id="habits-${goal.id}">
                            ${renderHabitsForGoal(goal.id)}
                        </div>
                        <button class="add-habit-btn" onclick="openHabitModal(${goal.id})">
                            + Add New Training
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Render habits for a specific goal
        function renderHabitsForGoal(goalId) {
            return state.habits.filter(h => h.goalId === goalId).map(habit => `
                <div class="habit-item" data-id="${habit.id}">
                    <div class="habit-checkbox ${habit.completed ? 'checked' : ''}" onclick="toggleHabit(${habit.id})"></div>
                    <div class="habit-content">
                        <div class="habit-name">
                            ${habit.name}
                            ${habit.frequency !== 'daily' ? `<span class="frequency-badge">${habit.frequency.toUpperCase()}</span>` : ''}
                        </div>
                        <div class="habit-stats">
                            <div class="stat-item">
                                <span class="stat-value">${habit.successRate}%</span>
                                <span>Success</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value">🔥 ${habit.streak}</span>
                                <span>Streak</span>
                            </div>
                        </div>
                    </div>
                    <div class="edit-actions">
                        <button class="edit-icon-btn" onclick="event.stopPropagation(); editHabit(${habit.id})">✏️ Edit</button>
                        <button class="edit-icon-btn" onclick="event.stopPropagation(); deleteHabit(${habit.id})" style="color: var(--hp);">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Render habits
        function renderHabits() {
            const grid = document.getElementById('habitGrid');
            grid.innerHTML = state.habits.filter(h => !h.goalId).map(habit => `
                <div class="habit-item" data-id="${habit.id}">
                    <div class="habit-checkbox ${habit.completed ? 'checked' : ''}" onclick="toggleHabit(${habit.id})"></div>
                    <div class="habit-content">
                        <div class="habit-name">
                            ${habit.name}
                            ${habit.frequency !== 'daily' ? `<span class="frequency-badge">${habit.frequency.toUpperCase()}</span>` : ''}
                        </div>
                        <div class="habit-stats">
                            <div class="stat-item">
                                <span class="stat-value">${habit.successRate}%</span>
                                <span>Success</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value">🔥 ${habit.streak}</span>
                                <span>Streak</span>
                            </div>
                        </div>
                    </div>
                    <div class="edit-actions">
                        <button class="edit-btn" onclick="editHabit(${habit.id})">Edit</button>
                        <button class="edit-btn delete-btn" onclick="deleteHabit(${habit.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Toggle habit completion
        function toggleHabit(id) {
            const habit = state.habits.find(h => h.id === id);
            if (habit) {
                habit.completed = !habit.completed;
                if (habit.completed) {
                    // Update stats
                    state.exp.current += 50;
                    state.mana.current = Math.min(state.mana.current + 10, state.mana.max);
                    
                    // Level up check
                    if (state.exp.current >= state.exp.max) {
                        state.level++;
                        state.exp.current = state.exp.current - state.exp.max;
                        state.exp.max = state.level * 600;
                        state.hp.max += 20;
                        state.hp.current = state.hp.max;
                        state.mana.max += 10;
                        state.mana.current = state.mana.max;
                        showNotify('Level Up!', `You are now level ${state.level}! Your HP and Mana have been fully restored.`);
                    }
                } else {
                    // Deduct stats
                    state.exp.current = Math.max(0, state.exp.current - 50);
                    state.hp.current = Math.max(1, state.hp.current - 5);
                }
                saveState();
                renderGoals();
                updateStats();
            }
        }

        // Update character stats display
        function updateStats() {
            document.querySelector('.level-display').textContent = `LEVEL ${state.level}`;
            document.querySelector('.hp-bar').style.width = `${(state.hp.current / state.hp.max) * 100}%`;
            document.querySelector('.mana-bar').style.width = `${(state.mana.current / state.mana.max) * 100}%`;
            document.querySelector('.exp-bar').style.width = `${(state.exp.current / state.exp.max) * 100}%`;
            
            // Update stat labels
            document.querySelectorAll('.stat-label span:last-child')[0].textContent = `${state.hp.current}/${state.hp.max}`;
            document.querySelectorAll('.stat-label span:last-child')[1].textContent = `${state.mana.current}/${state.mana.max}`;
            document.querySelectorAll('.stat-label span:last-child')[2].textContent = `${state.exp.current}/${state.exp.max}`;
        }

        // Modal functions
        function openGoalModal() {
            document.getElementById('goalModal').classList.add('active');
        }

        function closeGoalModal() {
            document.getElementById('goalModal').classList.remove('active');
        }

        function openHabitModal(goalId) {
            document.getElementById('habitModal').classList.add('active');
            document.getElementById('habitModal').dataset.goalId = goalId;
        }

        function closeHabitModal() {
            document.getElementById('habitModal').classList.remove('active');
        }

        function saveGoal() {
            const name = document.getElementById('goalName').value;
            const category = document.getElementById('goalCategory').value;
            const yearly = document.getElementById('goalYearly').value;
            
            if (name) {
                const newGoal = {
                    id: Date.now(),
                    title: name,
                    category: category,
                    yearly: yearly || 'Define yearly goal',
                    leadIndicator: 'Actions I control',
                    lagIndicator: 'Results I measure',
                    quarterly: 'Define quarterly milestone',
                    monthly: 'Define monthly target',
                    weekly: 'Define weekly goal'
                };
                state.goals.push(newGoal);
                saveState();
                renderGoals();
                closeGoalModal();
                // Clear form
                document.getElementById('goalName').value = '';
                document.getElementById('goalYearly').value = '';
            }
        }

        function saveHabit() {
            const name = document.getElementById('habitName').value;
            const frequency = document.getElementById('habitFrequency').value;
            
            if (name) {
                const goalId = parseInt(document.getElementById('habitModal').dataset.goalId);
                const newHabit = {
                    id: Date.now(),
                    goalId: goalId,
                    name: name,
                    frequency: frequency,
                    completed: false,
                    streak: 0,
                    successRate: 0
                };
                state.habits.push(newHabit);
                saveState();
                renderGoals();
                closeHabitModal();
            }
        }

        // Edit modal variables
        let editModalCallback = null;

        function openEditModal(title, label, currentValue, callback) {
            document.getElementById('editModalTitle').textContent = title;
            document.getElementById('editModalLabel').textContent = label;
            document.getElementById('editModalInput').value = currentValue;
            document.getElementById('editModal').classList.add('active');
            editModalCallback = callback;
            // Focus input
            setTimeout(() => {
                document.getElementById('editModalInput').focus();
            }, 100);
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editModalCallback = null;
        }

        function saveEditModal() {
            const value = document.getElementById('editModalInput').value;
            if (editModalCallback && value) {
                editModalCallback(value);
            }
            closeEditModal();
        }

        // Goal settings variables
        let currentEditGoalId = null;

        function editGoal(id) {
            const goal = state.goals.find(g => g.id === id);
            if (goal) {
                currentEditGoalId = id;
                document.getElementById('settingsTitle').value = goal.title;
                document.getElementById('settingsCategory').value = goal.category;
                
                // Set selected color
                document.querySelectorAll('.color-option').forEach(btn => {
                    btn.classList.remove('selected');
                    if (btn.dataset.color === (goal.color || getCategoryColor(goal.category))) {
                        btn.classList.add('selected');
                    }
                });
                
                document.getElementById('goalSettingsModal').classList.add('active');
            }
        }

        function closeGoalSettings() {
            document.getElementById('goalSettingsModal').classList.remove('active');
            currentEditGoalId = null;
        }

        function saveGoalSettings() {
            const goal = state.goals.find(g => g.id === currentEditGoalId);
            if (goal) {
                goal.title = document.getElementById('settingsTitle').value;
                goal.category = document.getElementById('settingsCategory').value;
                const selectedColor = document.querySelector('.color-option.selected');
                if (selectedColor) {
                    goal.color = selectedColor.dataset.color;
                }
                saveState();
                renderGoals();
            }
            closeGoalSettings();
        }

        function editGoalPeriod(id, period) {
            const goal = state.goals.find(g => g.id === id);
            if (goal) {
                const periodNames = {
                    yearly: 'Yearly Goal',
                    quarterly: 'Quarterly Milestone',
                    monthly: 'Monthly Target',
                    weekly: 'Weekly Goal'
                };
                
                openEditModal(
                    `Edit ${periodNames[period]}`,
                    `${goal.title} - ${periodNames[period]}`,
                    goal[period],
                    (value) => {
                        goal[period] = value;
                        saveState();
                        renderGoals();
                    }
                );
            }
        }

        function getCategoryColor(category) {
            const colors = {
                spiritual: '#a855f7',
                financial: '#f59e0b',
                health: '#ef4444',
                community: '#3b82f6',
                personal: '#10b981'
            };
            return colors[category] || '#a855f7';
        }

        // Confirm modal logic
        let confirmModalResolve = null;

        function showConfirm(title, message, actionLabel) {
            return new Promise(resolve => {
                confirmModalResolve = resolve;
                document.getElementById('confirmModalTitle').textContent = title;
                document.getElementById('confirmModalMessage').textContent = message;
                document.getElementById('confirmModalAction').textContent = actionLabel || 'Delete';
                document.getElementById('confirmModalAction').onclick = () => closeConfirmModal(true);
                document.getElementById('confirmModal').classList.add('active');
            });
        }

        function closeConfirmModal(result) {
            document.getElementById('confirmModal').classList.remove('active');
            if (confirmModalResolve) {
                confirmModalResolve(result);
                confirmModalResolve = null;
            }
        }

        function showNotify(title, message) {
            document.getElementById('notifyModalTitle').textContent = title;
            document.getElementById('notifyModalMessage').textContent = message;
            document.getElementById('notifyModal').classList.add('active');
        }

        function closeNotifyModal() {
            document.getElementById('notifyModal').classList.remove('active');
        }

        async function deleteGoal(id) {
            const confirmed = await showConfirm('Delete Goal', 'Delete this goal and all its habits? This cannot be undone.', 'Delete');
            if (confirmed) {
                state.goals = state.goals.filter(g => g.id !== id);
                state.habits = state.habits.filter(h => h.goalId !== id);
                saveState();
                renderGoals();
            }
        }

        function editHabit(id) {
            const habit = state.habits.find(h => h.id === id);
            if (habit) {
                openEditModal(
                    'Edit Training',
                    'Training Name',
                    habit.name,
                    (value) => {
                        habit.name = value;
                        saveState();
                        renderGoals();
                    }
                );
            }
        }

        async function deleteHabit(id) {
            const confirmed = await showConfirm('Remove Training', 'Remove this training from your regimen?', 'Remove');
            if (confirmed) {
                state.habits = state.habits.filter(h => h.id !== id);
                saveState();
                renderGoals();
            }
        }

        function addSubGoal(period) {
            alert(`Sub-goals for ${period} quests coming soon!`);
        }

        function completeDay() {
            const textarea = document.querySelector('.reflection-textarea');
            if (textarea.value) {
                showNotify('Quest Complete', 'Quest journal saved! Rest well, brave warrior. Tomorrow brings new adventures!');
                textarea.value = '';
                
                // Reset daily habits
                state.habits.forEach(habit => {
                    if (habit.frequency === 'daily') {
                        habit.completed = false;
                    }
                });
                
                // Restore some HP/Mana for the new day
                state.hp.current = Math.min(state.hp.max, state.hp.current + 20);
                state.mana.current = state.mana.max;
                
                saveState();
                renderGoals();
                updateStats();
            }
        }

        // Update goal field directly
        function updateGoalField(goalId, field, value) {
            const goal = state.goals.find(g => g.id === goalId);
            if (goal) {
                goal[field] = value;
                saveState();
            }
        }
        
        // Calculate stats for leveling
        function calculateLevel() {
            const totalGoals = state.goals.length;
            const completedHabits = state.habits.filter(h => h.completed).length;
            const totalHabits = state.habits.length;
            
            // Simple leveling: 1 level per goal + bonus for habits
            const newLevel = totalGoals + Math.floor(completedHabits / 3);
            
            if (newLevel !== state.level) {
                state.level = newLevel;
                state.hp.max = 100 + (newLevel * 10);
                state.hp.current = state.hp.max;
                state.mana.max = 50 + (newLevel * 5);
                state.mana.current = state.mana.max;
                state.exp.max = 100 + (newLevel * 50);
                updateStats();
            }
        }

        // Initialize on load
        init();
        calculateLevel();
        
        // Removed fallback HTML - JavaScript handles everything now
    </script>
</body>
</html>
