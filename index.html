    <meta http-equiv="cache-control" content="no-cache">

    <title>Quest Tracker - Nightly Update</title>
    <style>

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            min-height: 100vh;
        }

        .container {

            margin: 0 auto;

        }

        /* Character Section */

            background-size: contain;
        }

        .character-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: #fbbf24;
        }

        .stats-panel {
            flex: 1;
            padding: 0 2rem;
        }

        .level-display {
            font-size: 2rem;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 1rem;
        }

        .stat-bar {
            margin-bottom: 0.75rem;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
            color: #999;
        }

        .bar-wrapper {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .hp-bar { background: #ef4444; width: 100%; height: 100%; }
        .mana-bar { background: #3b82f6; width: 100%; height: 100%; }
        .exp-bar { background: #fbbf24; width: 100%; height: 100%; }

        /* Goals Section */
        .goals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
        }

        .add-goal-btn {
            background: #a855f7;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-goal-btn:hover {
            background: #9333ea;
        }

        .goal-card {
            background: #1a1a1a;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .goal-card.spiritual { border-left: 4px solid #a855f7; }
        .goal-card.financial { border-left: 4px solid #f59e0b; }
        .goal-card.health { border-left: 4px solid #ef4444; }
        .goal-card.community { border-left: 4px solid #3b82f6; }
        .goal-card.personal { border-left: 4px solid #10b981; }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
        }

        .goal-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .goal-title:hover {
            opacity: 0.8;
        }

        .goal-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .icon-btn:hover {
            opacity: 1;
        }

        .goal-content {
            padding: 1.5rem;
        }

        .indicators-section {
            margin-bottom: 1.5rem;
        }

        .indicator-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        input[type="text"]:not(.editable-text) {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }

        .hierarchy-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .hierarchy-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hierarchy-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .hierarchy-label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 0.5rem;
        }

        .links-section {
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .links-section h4 {
            color: #999;
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .add-link-btn {
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.5);
            color: #a855f7;
            border-radius: 0.25rem;
            cursor: pointer;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.25rem;
            margin-bottom: 0.5rem;
        }

        .link-item a {
            color: #60a5fa;
            text-decoration: none;
            flex: 1;
        }

        .link-item a:hover {
            text-decoration: underline;
        }

        .habits-section {
            margin-top: 1.5rem;
        }

        .habits-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .habit-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .habit-checkbox {
            width: 2rem;
            height: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .habit-checkbox.checked {
            background: #10b981;
            border-color: #10b981;
        }

        .habit-checkbox.checked::after {
            content: '✓';
            color: white;
        }

        .add-habit-btn {
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.5);
            color: #a855f7;
            border-radius: 0.25rem;
            cursor: pointer;
        }

        /* Quest Journal */
        .quest-journal {
            background: #1a1a1a;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            margin-top: 2rem;
            text-align: center;
        }

        .quest-journal h2 {
            color: #a855f7;
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: inherit;
            resize: vertical;
        }

        .complete-btn {
            margin-top: 1rem;
            background: #10b981;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.125rem;
            cursor: pointer;
            font-weight: bold;
        }

        .complete-btn:hover {
            background: #059669;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #666;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        .btn-primary {
            background: #a855f7;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background: #9333ea;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .version {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #666;
            font-size: 0.75rem;
        }

        .color-swatches {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            padding: 1rem;
        }

        .color-swatch {
            width: 40px;
            height: 40px;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid transparent;
        }

        .color-swatch:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .editable-text {
            background: transparent;
            border: none;
            color: inherit;
            font-size: inherit;
            font-weight: inherit;
            font-family: inherit;
            width: 100%;
            padding: 0.5rem;
            border-radius: 0.25rem;
            transition: background 0.2s;
        }

        .editable-text:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .editable-text:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Character Section -->
        <div class="character-section">
            <div class="character-wrapper">
                <div class="pixel-character"></div>
                <div class="character-name">DEVON THE WISE</div>
            </div>
            <div class="stats-panel">
                <div class="level-display" id="levelDisplay">LEVEL 0</div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>HP</span>
                        <span id="hpLabel">100/100</span>
                    </div>
                    <div class="bar-wrapper">
                        <div class="hp-bar" id="hpBar"></div>
                    </div>
                </div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>MANA</span>
                        <span id="manaLabel">50/50</span>
                    </div>
                    <div class="bar-wrapper">
                        <div class="mana-bar" id="manaBar"></div>
                    </div>
                </div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>EXP</span>
                        <span id="expLabel">0/100</span>
                    </div>
                    <div class="bar-wrapper">
                        <div class="exp-bar" id="expBar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Goals Section -->
        <div class="goals-header">
            <h1 class="section-title">Epic Goals</h1>
            <button class="add-goal-btn" onclick="openGoalModal()">
                <span>✨</span> New Goal
            </button>
        </div>

        <div id="goalsContainer"></div>

        <!-- Quest Journal -->
        <div class="quest-journal">
            <h2>Quest Journal</h2>
            <textarea id="questJournal" placeholder="What epic battles did you win today? What dragons remain to slay tomorrow?"></textarea>
            <button class="complete-btn" onclick="completeQuest()">
                Complete Quest & Rest at Inn
            </button>
        </div>
    </div>

    <!-- Add Goal Modal -->
    <div id="goalModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Create New Goal</h3>
                <button class="close-btn" onclick="closeGoalModal()">×</button>
            </div>
            <div class="form-group">
                <label>Goal Name</label>
                <input type="text" id="goalName" placeholder="e.g., Build AI Trading System">
            </div>
            <button class="btn-primary" onclick="saveGoal()">Create Goal</button>
        </div>
    </div>

    <div class="version">v1.4 - Professional Edit Modals</div>

    <!-- Color Picker Modal -->
    <div id="colorPickerModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 class="modal-title">Choose Goal Color</h3>
                <button class="close-btn" onclick="closeColorPicker()">×</button>
            </div>
            <div style="padding: 1rem;">
                <input type="color" id="colorWheel" style="width: 100%; height: 150px; border: none; border-radius: 0.5rem; cursor: pointer;" onchange="selectColor(this.value)">
                <p style="margin: 1rem 0 0.5rem 0; color: #999; font-size: 0.875rem;">Quick Colors:</p>
            </div>
            <div class="color-swatches">
                <div class="color-swatch" style="background: #a855f7" onclick="selectColor('#a855f7')"></div>
                <div class="color-swatch" style="background: #f59e0b" onclick="selectColor('#f59e0b')"></div>
                <div class="color-swatch" style="background: #ef4444" onclick="selectColor('#ef4444')"></div>
                <div class="color-swatch" style="background: #3b82f6" onclick="selectColor('#3b82f6')"></div>
                <div class="color-swatch" style="background: #10b981" onclick="selectColor('#10b981')"></div>
                <div class="color-swatch" style="background: #ec4899" onclick="selectColor('#ec4899')"></div>
                <div class="color-swatch" style="background: #8b5cf6" onclick="selectColor('#8b5cf6')"></div>
                <div class="color-swatch" style="background: #14b8a6" onclick="selectColor('#14b8a6')"></div>
            </div>
        </div>
    </div>

    <!-- Text Edit Modal -->
    <div id="textEditModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3 class="modal-title" id="editModalTitle">Edit Text</h3>
                <button class="close-btn" onclick="closeTextEdit()">×</button>
            </div>
            <div class="form-group">
                <textarea id="editTextArea" style="width: 100%; min-height: 100px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 1rem; border-radius: 0.5rem; font-size: 1rem; font-family: inherit;"></textarea>
            </div>
            <button class="btn-primary" onclick="saveTextEdit()">Save</button>
        </div>
    </div>

    <script>
        // State management
        let state = {
            level: 0,
            hp: { current: 100, max: 100 },
            mana: { current: 50, max: 50 },
            exp: { current: 0, max: 100 },
            goals: [],
            journal: ''
        };

        // Initialize
        function init() {
            loadState();
            renderAll();
        }

        // Load state from localStorage
        function loadState() {
            const saved = localStorage.getItem('questTracker');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                    // Ensure all goals have names (fix for old data)
                    if (state.goals) {
                        state.goals.forEach((goal, index) => {
                            if (!goal.name) {
                                goal.name = goal.title || `Goal ${index + 1}`;
                            }
                        });
                    }
                } catch (e) {
                    console.error('Failed to load state:', e);
                }
            }
        }

        // Save state to localStorage
        function saveState() {
            localStorage.setItem('questTracker', JSON.stringify(state));
        }

        // Render everything
        function renderAll() {
            renderStats();
            renderGoals();
            document.getElementById('questJournal').value = state.journal || '';
        }

        // Render character stats
        function renderStats() {
            document.getElementById('levelDisplay').textContent = `LEVEL ${state.level}`;
            document.getElementById('hpLabel').textContent = `${state.hp.current}/${state.hp.max}`;
            document.getElementById('manaLabel').textContent = `${state.mana.current}/${state.mana.max}`;
            document.getElementById('expLabel').textContent = `${state.exp.current}/${state.exp.max}`;
            
            document.getElementById('hpBar').style.width = `${(state.hp.current / state.hp.max) * 100}%`;
            document.getElementById('manaBar').style.width = `${(state.mana.current / state.mana.max) * 100}%`;
            document.getElementById('expBar').style.width = `${(state.exp.current / state.exp.max) * 100}%`;
        }

        // Get color for category
        function getCategoryColor(category) {
            const colors = {
                spiritual: '#a855f7',
                financial: '#f59e0b',
                health: '#ef4444',
                community: '#3b82f6',
                personal: '#10b981'
            };
            return colors[category] || '#a855f7';
        }

        // Render goals
        function renderGoals() {
            const container = document.getElementById('goalsContainer');
            
            if (state.goals.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No goals yet! Click "New Goal" to begin your quest.</p></div>';
                return;
            }
            
            container.innerHTML = state.goals.map(goal => `
                <div class="goal-card ${goal.category}" style="border-left-color: ${goal.color || getCategoryColor(goal.category)}">
                    <div class="goal-header">
                        <h3 class="goal-title" 
                            style="color: ${goal.color || getCategoryColor(goal.category)}" 
                            onclick="editGoalTitle('${goal.id}')">${goal.name}</h3>
                        <div class="goal-actions">
                            <button class="icon-btn" onclick="changeGoalColor('${goal.id}')" title="Change color">🎨</button>
                            <button class="icon-btn" onclick="deleteGoal('${goal.id}')">🗑️</button>
                        </div>
                    </div>
                    <div class="goal-content">
                        <div class="indicators-section">
                            <div style="margin-bottom: 1.5rem;">
                                <label style="font-size: 0.875rem; color: #999; text-transform: uppercase; letter-spacing: 0.05em;">Yearly Goal</label>
                                <div style="margin-top: 0.5rem; padding: 1rem; background: rgba(255, 255, 255, 0.03); border-radius: 0.5rem; cursor: pointer; transition: all 0.2s;"
                                    onclick="editGoalField('${goal.id}', 'yearly', 'Yearly Goal')"
                                    onmouseover="this.style.background='rgba(255, 255, 255, 0.06)'"
                                    onmouseout="this.style.background='rgba(255, 255, 255, 0.03)'">
                                    <div style="font-size: 1.125rem; font-weight: 500;">${goal.yearly || 'Click to define yearly goal'}</div>
                                </div>
                            </div>
                            <div class="indicator-row">
                                <div>
                                    <label style="font-size: 0.75rem; color: #999; text-transform: uppercase;">Lead Indicator (Actions)</label>
                                    <div style="margin-top: 0.25rem; padding: 0.75rem; background: rgba(255, 255, 255, 0.03); border-radius: 0.375rem; cursor: pointer; transition: all 0.2s;"
                                        onclick="editGoalField('${goal.id}', 'leadIndicator', 'Lead Indicator')"
                                        onmouseover="this.style.background='rgba(255, 255, 255, 0.06)'"
                                        onmouseout="this.style.background='rgba(255, 255, 255, 0.03)'">
                                        <div style="font-size: 0.875rem;">${goal.leadIndicator || 'Click to add actions you control'}</div>
                                    </div>
                                </div>
                                <div>
                                    <label style="font-size: 0.75rem; color: #999; text-transform: uppercase;">Lag Indicator (Results)</label>
                                    <div style="margin-top: 0.25rem; padding: 0.75rem; background: rgba(255, 255, 255, 0.03); border-radius: 0.375rem; cursor: pointer; transition: all 0.2s;"
                                        onclick="editGoalField('${goal.id}', 'lagIndicator', 'Lag Indicator')"
                                        onmouseover="this.style.background='rgba(255, 255, 255, 0.06)'"
                                        onmouseout="this.style.background='rgba(255, 255, 255, 0.03)'">
                                        <div style="font-size: 0.875rem;">${goal.lagIndicator || 'Click to add results you measure'}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="hierarchy-grid">
                            <div class="hierarchy-item" onclick="editPeriod('${goal.id}', 'quarterly')">
                                <div class="hierarchy-label">QUARTERLY</div>
                                <div>${goal.quarterly || 'Click to set'}</div>
                            </div>
                            <div class="hierarchy-item" onclick="editPeriod('${goal.id}', 'monthly')">
                                <div class="hierarchy-label">MONTHLY</div>
                                <div>${goal.monthly || 'Click to set'}</div>
                            </div>
                            <div class="hierarchy-item" onclick="editPeriod('${goal.id}', 'weekly')">
                                <div class="hierarchy-label">WEEKLY</div>
                                <div>${goal.weekly || 'Click to set'}</div>
                            </div>
                        </div>
                        
                        <div class="links-section">
                            <div class="section-header">
                                <h4>Quick Links</h4>
                                <button class="add-link-btn" onclick="addLink('${goal.id}')">+ Add Link</button>
                            </div>
                            <div class="links-container">
                                ${renderLinks(goal.id)}
                            </div>
                        </div>
                        
                        <div class="habits-section">
                            <div class="habits-header">
                                <h4>Daily Habits</h4>
                                <button class="add-habit-btn" onclick="addHabit('${goal.id}')">+ Add Habit</button>
                            </div>
                            ${renderHabits(goal.id)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Render links for a goal
        function renderLinks(goalId) {
            const goal = state.goals.find(g => g.id === goalId);
            if (!goal || !goal.links || goal.links.length === 0) {
                return '<div style="color: #666; font-size: 0.875rem;">No links yet</div>';
            }
            
            return goal.links.map(link => `
                <div class="link-item">
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.name}</a>
                    <button class="icon-btn" style="color: #ef4444;" 
                        onclick="deleteLink('${goalId}', '${link.id}')">×</button>
                </div>
            `).join('');
        }

        // Render habits for a goal
        function renderHabits(goalId) {
            const goal = state.goals.find(g => g.id === goalId);
            if (!goal.habits || goal.habits.length === 0) {
                return '<div style="color: #666; font-size: 0.875rem;">No habits yet</div>';
            }
            
            return goal.habits.map(habit => `
                <div class="habit-item">
                    <div class="habit-checkbox ${habit.completed ? 'checked' : ''}" 
                        onclick="toggleHabit('${goalId}', '${habit.id}')"></div>
                    <div style="flex: 1;">${habit.name}</div>
                    <button class="icon-btn" style="color: #ef4444;" 
                        onclick="deleteHabit('${goalId}', '${habit.id}')">×</button>
                </div>
            `).join('');
        }

        // Modal functions
        function openGoalModal() {
            document.getElementById('goalModal').classList.add('active');
            document.getElementById('goalName').focus();
        }

        function closeGoalModal() {
            document.getElementById('goalModal').classList.remove('active');
            document.getElementById('goalName').value = '';
        }

        // Save new goal
        function saveGoal() {
            const name = document.getElementById('goalName').value;
            
            if (!name) return;
            
            const newGoal = {
                id: Date.now().toString(),
                name: name,
                category: 'personal',  // Default category
                yearly: 'Define your yearly goal',
                leadIndicator: '',
                lagIndicator: '',
                quarterly: '',
                monthly: '',
                weekly: '',
                habits: [],
                links: []
            };
            
            state.goals.push(newGoal);
            
            // Level up!
            state.level++;
            state.hp.max = 100 + (state.level * 10);
            state.hp.current = state.hp.max;
            state.mana.max = 50 + (state.level * 5);
            state.mana.current = state.mana.max;
            state.exp.max = 100 + (state.level * 50);
            
            saveState();
            renderAll();
            closeGoalModal();
        }

        // Update goal field
        function updateGoal(goalId, field, value) {
            const goal = state.goals.find(g => g.id === goalId);
            if (goal) {
                goal[field] = value;
                saveState();
            }
        }

        // Edit period
        function editPeriod(goalId, period) {
            const periodTitles = {
                quarterly: 'Quarterly Goal',
                monthly: 'Monthly Goal',
                weekly: 'Weekly Goal'
            };
            editGoalField(goalId, period, periodTitles[period]);
        }

        // Delete goal
        function deleteGoal(goalId) {
            if (confirm('Delete this goal?')) {
                state.goals = state.goals.filter(g => g.id !== goalId);
                
                // Lose a level
                if (state.level > 0) {
                    state.level--;
                    state.hp.max = 100 + (state.level * 10);
                    state.hp.current = Math.min(state.hp.current, state.hp.max);
                    state.mana.max = 50 + (state.level * 5);
                    state.mana.current = Math.min(state.mana.current, state.mana.max);
                    state.exp.max = 100 + (state.level * 50);
                    state.exp.current = Math.min(state.exp.current, state.exp.max);
                }
                
                saveState();
                renderAll();
            }
        }

        // Add habit
        function addHabit(goalId) {
            const goal = state.goals.find(g => g.id === goalId);
            if (goal) {
                const habitName = prompt('Habit name:');
                if (habitName) {
                    if (!goal.habits) goal.habits = [];
                    goal.habits.push({
                        id: Date.now().toString(),
                        name: habitName,
                        completed: false
                    });
                    saveState();
                    renderAll();
                }
            }
        }

        // Toggle habit
        function toggleHabit(goalId, habitId) {
            const goal = state.goals.find(g => g.id === goalId);
            if (goal) {
                const habit = goal.habits.find(h => h.id === habitId);
                if (habit) {
                    habit.completed = !habit.completed;
                    
                    if (habit.completed) {
                        // Gain EXP!
                        state.exp.current += 10;
                        if (state.exp.current >= state.exp.max) {
                            state.exp.current -= state.exp.max;
                            state.level++;
                            state.hp.max = 100 + (state.level * 10);
                            state.hp.current = state.hp.max;
                            state.mana.max = 50 + (state.level * 5);
                            state.mana.current = state.mana.max;
                            state.exp.max = 100 + (state.level * 50);
                            alert(`🎉 LEVEL UP! You're now Level ${state.level}!`);
                        }
                    }
                    
                    saveState();
                    renderAll();
                }
            }
        }

        // Delete habit
        function deleteHabit(goalId, habitId) {
            const goal = state.goals.find(g => g.id === goalId);
            if (goal) {
                goal.habits = goal.habits.filter(h => h.id !== habitId);
                saveState();
                renderAll();
            }
        }

        // Add link to goal
        function addLink(goalId) {
            const goal = state.goals.find(g => g.id === goalId);
            if (goal) {
                const linkName = prompt('Link name (e.g., Notion Dashboard):');
                const linkUrl = prompt('Link URL:');
                if (linkName && linkUrl) {
                    if (!goal.links) goal.links = [];
                    goal.links.push({
                        id: Date.now().toString(),
                        name: linkName,
                        url: linkUrl.startsWith('http') ? linkUrl : 'https://' + linkUrl
                    });
                    saveState();
                    renderAll();
                }
            }
        }

        // Delete link from goal
        function deleteLink(goalId, linkId) {
            const goal = state.goals.find(g => g.id === goalId);
            if (goal && goal.links) {
                goal.links = goal.links.filter(l => l.id !== linkId);
                saveState();
                renderAll();
            }
        }

        // Change goal color
        let currentColorGoalId = null;
        
        function changeGoalColor(goalId) {
            currentColorGoalId = goalId;
            document.getElementById('colorPickerModal').classList.add('active');
        }
        
        function closeColorPicker() {
            document.getElementById('colorPickerModal').classList.remove('active');
            currentColorGoalId = null;
        }
        
        function selectColor(color) {
            if (currentColorGoalId) {
                const goal = state.goals.find(g => g.id === currentColorGoalId);
                if (goal) {
                    goal.color = color;
                    saveState();
                    renderAll();
                }
            }
            closeColorPicker();
        }

        // Edit text fields
        let currentEditGoalId = null;
        let currentEditField = null;
        
        function editGoalTitle(goalId) {
            const goal = state.goals.find(g => g.id === goalId);
            if (goal) {
                currentEditGoalId = goalId;
                currentEditField = 'name';
                document.getElementById('editModalTitle').textContent = 'Edit Goal Title';
                document.getElementById('editTextArea').value = goal.name;
                document.getElementById('textEditModal').classList.add('active');
                document.getElementById('editTextArea').focus();
            }
        }
        
        function editGoalField(goalId, field, title) {
            const goal = state.goals.find(g => g.id === goalId);
            if (goal) {
                currentEditGoalId = goalId;
                currentEditField = field;
                document.getElementById('editModalTitle').textContent = `Edit ${title}`;
                document.getElementById('editTextArea').value = goal[field] || '';
                document.getElementById('textEditModal').classList.add('active');
                document.getElementById('editTextArea').focus();
            }
        }
        
        function closeTextEdit() {
            document.getElementById('textEditModal').classList.remove('active');
            currentEditGoalId = null;
            currentEditField = null;
        }
        
        function saveTextEdit() {
            if (currentEditGoalId && currentEditField) {
                const goal = state.goals.find(g => g.id === currentEditGoalId);
                if (goal) {
                    goal[currentEditField] = document.getElementById('editTextArea').value;
                    saveState();
                    renderAll();
                }
            }
            closeTextEdit();
        }
        
        // Complete quest
        function completeQuest() {
            state.journal = document.getElementById('questJournal').value;
            saveState();
            
            // Reset all habits for new day
            state.goals.forEach(goal => {
                if (goal.habits) {
                    goal.habits.forEach(habit => {
                        habit.completed = false;
                    });
                }
            });
            
            // Restore some mana
            state.mana.current = Math.min(state.mana.current + 20, state.mana.max);
            
            saveState();
            renderAll();
            
            alert('Quest complete! You rest at the inn and restore 20 mana. Tomorrow brings new challenges!');
        }

        // Save journal on change
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('questJournal').addEventListener('input', (e) => {
                state.journal = e.target.value;
                saveState();
            });
            
            // Always show sample goal for testing
            if (state.goals.length === 0) {
                state.goals.push({
                    id: Date.now().toString(),
                    name: 'Build AI Trading System',
                    category: 'financial',
                    yearly: '40% revenue growth + profitable crypto trading',
                    leadIndicator: 'Daily chart reviews + AI system development',
                    lagIndicator: 'Monthly revenue + portfolio growth %',
                    quarterly: 'Launch AI crypto screener',
                    monthly: 'Test 3 trading strategies',
                    weekly: 'Review 20 charts',
                    habits: [{
                        id: (Date.now() + 1).toString(),
                        name: 'Review Trading Charts',
                        completed: false
                    }]
                });
                state.level = 1;
                state.hp.max = 110;
                state.hp.current = 110;
                state.mana.max = 55;
                state.mana.current = 55;
                state.exp.max = 150;
                // Don't save yet - let user see the sample first
                // saveState();
            }
            
            init();
        });
    </script>
</body>
</html>
