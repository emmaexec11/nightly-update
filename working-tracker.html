<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Goal Tracker - v4.0</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 2rem;
        }
        
        .goal {
            background: #1a1a1a;
            border-left: 4px solid #f59e0b;
            padding: 2rem;
            margin: 2rem 0;
            border-radius: 0.5rem;
        }
        
        h1 { color: #f59e0b; }
        
        .btn {
            background: #8b5cf6;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .btn:hover { background: #7c3aed; }
        
        input[type="text"] {
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 0.5rem;
            border-radius: 0.25rem;
            width: 100%;
            margin: 0.5rem 0;
        }
        
        .habit {
            background: #2a2a2a;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .checkbox {
            width: 2rem;
            height: 2rem;
            background: #444;
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .checkbox.checked {
            background: #10b981;
        }
        
        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 1.25rem;
        }
        
        .version {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #666;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="version">Version 4.0 - Fresh Deploy - ${new Date().toLocaleString()}</div>
    
    <h1>Devon's Goal Tracker</h1>
    <p>Level <span id="level">1</span> - ${new Date().toDateString()}</p>
    
    <button class="btn" onclick="addGoal()">+ Add New Goal</button>
    
    <div id="goals">
        <div class="goal">
            <h2>Build AI Trading System</h2>
            <p><strong>Yearly Goal:</strong> 40% revenue growth + profitable crypto trading</p>
            
            <label>Lead Indicator (Actions you control):</label>
            <input type="text" value="Daily chart reviews + AI system development" onchange="save()">
            
            <label>Lag Indicator (Results you measure):</label>
            <input type="text" value="Monthly revenue + portfolio growth %" onchange="save()">
            
            <h3>Daily Habits</h3>
            <div class="habit">
                <div class="checkbox" onclick="toggleHabit(this)"></div>
                <span>Review Trading Charts</span>
            </div>
            
            <div style="margin-top: 1rem;">
                <button class="btn" style="background: #ef4444;" onclick="deleteGoal(this)">Delete Goal</button>
            </div>
        </div>
    </div>
    
    <script>
        // Simple state management
        let goals = JSON.parse(localStorage.getItem('goals') || '[]');
        let level = goals.length || 1;
        
        function updateLevel() {
            level = Math.max(1, goals.length);
            document.getElementById('level').textContent = level;
        }
        
        function toggleHabit(checkbox) {
            checkbox.classList.toggle('checked');
            if (checkbox.classList.contains('checked')) {
                alert('Great job! +50 EXP!');
            }
        }
        
        function addGoal() {
            const name = prompt('Goal name:');
            if (name) {
                const goalHtml = \`
                    <div class="goal">
                        <h2>\${name}</h2>
                        <p><strong>Yearly Goal:</strong> Define your yearly goal</p>
                        
                        <label>Lead Indicator (Actions you control):</label>
                        <input type="text" placeholder="Actions I control" onchange="save()">
                        
                        <label>Lag Indicator (Results you measure):</label>
                        <input type="text" placeholder="Results I measure" onchange="save()">
                        
                        <h3>Daily Habits</h3>
                        <div class="habit">
                            <div class="checkbox" onclick="toggleHabit(this)"></div>
                            <span>New Habit</span>
                        </div>
                        
                        <div style="margin-top: 1rem;">
                            <button class="btn" style="background: #ef4444;" onclick="deleteGoal(this)">Delete Goal</button>
                        </div>
                    </div>
                \`;
                document.getElementById('goals').insertAdjacentHTML('beforeend', goalHtml);
                goals.push({name: name});
                save();
                updateLevel();
            }
        }
        
        function deleteGoal(button) {
            if (confirm('Delete this goal?')) {
                button.closest('.goal').remove();
                goals.pop(); // Simple tracking
                save();
                updateLevel();
            }
        }
        
        function save() {
            localStorage.setItem('goals', JSON.stringify(goals));
        }
        
        updateLevel();
    </script>
</body>
</html>
